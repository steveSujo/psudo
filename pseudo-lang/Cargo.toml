[package]
name = "psudo"
version = "0.11.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = { version = "0.95", features = [] }
tower = "0.4"
tower-service = "0.3"
toml = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
fnv = "1.0"
serde_yaml = "0.9"
pathdiff = "0.2"
ratatui = "0.29"
crossterm = "0.28"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"